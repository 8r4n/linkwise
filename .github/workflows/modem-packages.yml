name: Modem preview packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/modem-packages.yml'
      - 'packaging/**'
      - 'docs/install/**'
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'tools/package-modem.py'
      - 'tools/smoke-test-package.py'

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos, arch: arm64, runner: macos-15, format: pkg}
          - {os: macos, arch: x64, runner: macos-15-intel, format: pkg}
          - {os: windows, arch: arm64, runner: windows-11-arm, format: exe}
          - {os: windows, arch: x64, runner: windows-2025, format: exe}
          - {os: ubuntu, arch: arm64, runner: ubuntu-24.04-arm, format: deb}
          - {os: ubuntu, arch: x64, runner: ubuntu-24.04, format: deb}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Install Ubuntu build tools
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev pkg-config dpkg-dev
      - name: Build and test Unix installer
        if: matrix.os != 'windows'
        env:
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          python tools/package-modem.py "$PACKAGE_FORMAT"
          python tools/smoke-test-package.py dist/*."$PACKAGE_FORMAT"
      - name: Build and test Windows installer
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $inno = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
            throw 'Inno Setup checksum mismatch'
          }
          $installer = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$inno`""
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Inno Setup failed: $($installer.ExitCode)" }
          python tools/package-modem.py exe --iscc (Join-Path $inno 'ISCC.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packages = @(Get-ChildItem dist -Filter '*.exe')
          if ($packages.Count -ne 1) { throw 'Expected one Linkwise installer' }
          python tools/smoke-test-package.py $packages[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linkwise-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  fedora:
    name: Fedora 45 ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64}
          - {arch: x64, runner: ubuntu-24.04, platform: linux/amd64}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build and test Fedora RPM
        env:
          CONTAINER_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$CONTAINER_PLATFORM" -v "$PWD:/src" -w /src fedora:45 bash -euc '
            dnf install -y gcc alsa-lib-devel pkgconf-pkg-config rpm-build python3 sudo curl-minimal
            curl --proto "=https" --tlsv1.2 -fsS https://sh.rustup.rs -o /tmp/rustup.sh
            sh /tmp/rustup.sh -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            python3 tools/package-modem.py rpm
            python3 tools/smoke-test-package.py dist/*.rpm
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linkwise-fedora-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
