name: Adaptive network bench

on:
  push:
    branches: [main]
    paths: ['rust/network/**', 'rust-toolchain.toml', '.github/workflows/adaptive-network.yml']
  pull_request:
    paths: ['rust/network/**', 'rust-toolchain.toml', '.github/workflows/adaptive-network.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopback:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust/network
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - run: python3 tests/autonomous.py target/debug/linkwise-network
      - run: python3 tests/autonomous.py target/debug/linkwise-network --live-queue
