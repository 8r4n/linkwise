name: Secure modem transfer

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tools/test-secure-transfer.py'
      - 'tools/test-virtual-bw500.py'
      - 'tools/fetch-modem-profile.py'
      - '.github/workflows/secure-transfer.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'tools/test-secure-transfer.py'
      - 'tools/test-virtual-bw500.py'
      - 'tools/fetch-modem-profile.py'
      - '.github/workflows/secure-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64-bench:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [file, stdio, pin, dns, untrusted, limit, collision]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: '1.27.4'
          cache: false
      - if: matrix.scenario == 'file'
        run: cargo test --locked --manifest-path rust/Cargo.toml --features audio-device,secure-transfer
      - run: cargo build --locked --manifest-path rust/Cargo.toml --features audio-device,secure-transfer --bins
      - env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          module=$(find "$PWD/rust/target/debug/build" -name "libaws_lc_fips_*_crypto.dylib" -print -quit)
          test -n "$module"
          cargo rustc --locked --manifest-path rust/Cargo.toml --features audio-device,secure-transfer --bin linkwise -- -C "link-arg=-Wl,-rpath,$(dirname "$module")"
          python3 tools/fetch-modem-profile.py
          python3 tools/test-secure-transfer.py rust/target/debug/linkwise rust/target/debug/linkwise-modemd reference/vara/fixtures/level4/bw500-level4.json "$SCENARIO"
