[package]
name = "linkwise-network"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
bp7 = { version = "=0.12.2", default-features = false }
redb = "=2.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
[dev-dependencies]
tempfile = "3"
[profile.dev]
debug = 0
incremental = false
