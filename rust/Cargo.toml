[package]
name = "linkwise"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Linkwise cross-platform radio control and modem research scaffold"
license = "Apache-2.0"
default-run = "linkwise"

[lib]
name = "linkwise"
path = "src/lib.rs"

[[bin]]
name = "linkwise"
path = "src/main.rs"

[[bin]]
name = "linkwise-modemd"
path = "src/bin/linkwise-modemd.rs"

[[bin]]
name = "modem-demo"
path = "src/bin/modem-demo.rs"
required-features = ["demo"]

[dependencies]
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["fips"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
async-trait = "0.1"
base64 = "=0.23.1"
axum = { version = "0.8", features = ["json"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
cpal = { version = "0.15", optional = true }
hound = "3.5"
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-io"] }
rustfft = "6"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal"] }
tokio-stream = { version = "0.1.19", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }
mail-parser = "=0.11.4"
mail-builder = "=0.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_EventLog"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
audio-device = ["dep:cpal"]
demo = ["dep:axum", "dep:sha2", "dep:tokio-stream"]
mail-tls = ["dep:rustls", "rustls/ring", "rustls/tls12", "dep:tokio-rustls"]
secure-transfer = ["dep:aws-lc-rs", "dep:rustls", "rustls/fips", "dep:tokio-rustls", "dep:tempfile", "tokio/fs", "tokio/io-std"]
