[package]
name = "linkwise"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Linkwise cross-platform radio control and modem research scaffold"

[lib]
name = "linkwise"
path = "src/lib.rs"

[[bin]]
name = "linkwise"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
